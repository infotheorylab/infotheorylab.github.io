<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People - The Information Theory Laboratory</title>
    <meta name="description" content="Members and alumni of the Information Theory Laboratory at Harvard SEAS.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">

    <style>
        :root { --ink-soft: var(--ink); --ink-faint: #555; }

        .page-head { padding: clamp(64px, 9vw, 120px) 0 clamp(32px, 4vw, 48px); }
        .page-head .lede { margin-top: 24px; max-width: none; }
        .people-section { padding: 0 0 clamp(48px, 6vw, 80px); }

        /* ---------- Current members: two per row ---------- */
        .members {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px 48px;
        }
        .member {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .photo {
            flex-shrink: 0;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--paper-alt);
        }
        .photo.initials {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--serif);
            font-size: 28px;
            color: var(--ink-faint);
        }
        .pi .photo { width: 120px; height: 120px; }
        .name {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 22px;
            line-height: 1.25;
            margin: 0;
        }
        .pi .name { font-size: 28px; }
        .name a { text-decoration: none; }
        .name a:hover { color: var(--crimson); }
        .role { margin-top: 2px; font-size: 15px; }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 6px;
            font-family: var(--label);
            font-size: 13px;
        }
        .links a { color: var(--crimson); text-decoration: none; }
        .links a:hover { text-decoration: underline; text-underline-offset: 3px; }

        /* ---------- Alumni: text only ---------- */
        .alumni {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 48px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .alumnus .name { font-size: 19px; }
        .alumnus .role, .alumnus .thesis { font-size: 15px; }
        .thesis { margin-top: 2px; font-style: italic; }
        .thesis a { text-decoration: none; border-bottom: 1px solid var(--rule); }
        .thesis a:hover { color: var(--crimson); border-color: var(--crimson); }

        /* ---------- Visitors: names only ---------- */
        .names {
            columns: 3;
            column-gap: 48px;
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 17px;
        }
        .names li { padding: 4px 0; break-inside: avoid; }
        .names a { text-decoration: none; }
        .names a:hover { color: var(--crimson); }

        .join { font-size: 17px; }
        .join a { color: var(--crimson); }

        @media (max-width: 860px) {
            .members, .alumni { grid-template-columns: 1fr; }
            .names { columns: 2; }
        }
        @media (max-width: 480px) {
            .names { columns: 1; }
            .photo { width: 72px; height: 72px; }
            .pi .photo { width: 96px; height: 96px; }
        }
    </style>
</head>
<body>

<header data-site-header></header>

<main>

    <section class="page-head">
        <div class="wrap">
            <h1 class="display">People</h1>
            <p class="lede">We are fortunate to work with an amazing group of students, post-docs, and visitors.</p>
        </div>
    </section>

    <section class="people-section">
        <div class="wrap">
            <div class="bar"><span>Principal Investigator</span></div>
            <div id="pi"></div>
        </div>
    </section>

    <section class="people-section">
        <div class="wrap">
            <div class="bar"><span>PhD Students</span></div>
            <div class="members" id="students"></div>
        </div>
    </section>

    <section class="people-section">
        <div class="wrap">
            <div class="bar"><span>Post-docs</span></div>
            <div class="members" id="postdocs"></div>
        </div>
    </section>

    <section class="people-section">
        <div class="wrap">
            <div class="bar"><span>Former Students</span></div>
            <ul class="alumni" id="alumni-students"></ul>
        </div>
    </section>

    <section class="people-section">
        <div class="wrap">
            <div class="bar"><span>Former Post-docs</span></div>
            <ul class="alumni" id="alumni-postdocs"></ul>
        </div>
    </section>

    <section class="people-section">
        <div class="wrap">
            <div class="bar"><span>Former Visitors</span></div>
            <ul class="names" id="alumni-visitors"></ul>
        </div>
    </section>

    <section class="people-section">
        <div class="wrap">
            <p class="join">Interested in joining the group? See <a href="/contact">how to get in touch</a>.</p>
        </div>
    </section>

</main>

<footer data-site-footer></footer>

<script src="assets/site.js"></script>
<script>
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const ext = 'target="_blank" rel="noopener"';

    const nameHTML = p => p.website
        ? `<a href="${esc(p.website)}" ${ext}>${esc(p.name)}</a>`
        : esc(p.name);

    function photoHTML(p) {
        if (p.photo && p.photo !== 'placeholder.jpg') {
            return `<img class="photo" src="profile-pics/${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy">`;
        }
        const initials = p.name.replace(/^(Dr\.|Prof\.)\s+/, '').split(/\s+/).map(w => w[0]).slice(0, 2).join('');
        return `<div class="photo initials" aria-hidden="true">${esc(initials)}</div>`;
    }

    function linksHTML(p) {
        const links = [];
        if (p.website) links.push(`<a href="${esc(p.website)}" ${ext}>Website</a>`);
        if (p.google_scholar) links.push(`<a href="${esc(p.google_scholar)}" ${ext}>Scholar</a>`);
        if (p.linkedin) links.push(`<a href="${esc(p.linkedin)}" ${ext}>LinkedIn</a>`);
        return links.length ? `<div class="links">${links.join('')}</div>` : '';
    }

    const memberHTML = p => `
        <div class="member">
            ${photoHTML(p)}
            <div>
                <h3 class="name">${nameHTML(p)}</h3>
                <div class="role">${esc(p.role)}</div>
                ${linksHTML(p)}
            </div>
        </div>`;

    const alumnusHTML = p => `
        <li class="alumnus">
            <h3 class="name">${nameHTML(p)}</h3>
            <div class="role">${esc(p.role)}</div>
            ${p.thesis ? `<div class="thesis">Thesis: ${p.thesis.url ? `<a href="${esc(p.thesis.url)}" ${ext}>${esc(p.thesis.title)}</a>` : esc(p.thesis.title)}</div>` : ''}
        </li>`;

    fetch('people.json').then(r => r.json()).then(data => {
        document.getElementById('pi').innerHTML = `<div class="pi">${memberHTML(data.principal_investigator)}</div>`;

        const current = data.current || [];
        document.getElementById('students').innerHTML = current.filter(p => p.type === 'student').map(memberHTML).join('');
        document.getElementById('postdocs').innerHTML = current.filter(p => p.type === 'postdoc').map(memberHTML).join('');

        const alumni = data.alumni || [];
        document.getElementById('alumni-students').innerHTML =
            alumni.filter(p => p.type === 'phd' || p.type === 'masters').map(alumnusHTML).join('');
        document.getElementById('alumni-postdocs').innerHTML =
            alumni.filter(p => p.type === 'postdoc').map(alumnusHTML).join('');
        document.getElementById('alumni-visitors').innerHTML =
            alumni.filter(p => p.type === 'visitor').map(p => `<li>${nameHTML(p)}</li>`).join('');
    }).catch(err => console.error('Could not load people', err));
</script>

</body>
</html>
