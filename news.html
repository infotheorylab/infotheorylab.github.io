<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - The Information Theory Laboratory</title>
    <meta name="description" content="Announcements and highlights from the Information Theory Laboratory at Harvard SEAS.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">

    <style>
        :root { --ink-soft: var(--ink); --ink-faint: #555; }

        .page-head { padding: clamp(64px, 9vw, 120px) 0 clamp(32px, 4vw, 48px); }
        .page-head .lede { margin-top: 24px; max-width: none; }

        /* Items grouped by year, with the year in the left margin (as on the Research page). */
        .year-group {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 32px;
            border-top: 1px solid var(--ink);
        }
        .year-group:first-child { border-top: 0; }
        .year-label {
            position: sticky;
            top: 88px;
            align-self: start;
            margin: 0;
            padding-top: 24px;
            font-family: var(--serif);
            font-weight: 600;
            font-size: 36px;
            line-height: 1.1;
            color: var(--crimson);
        }
        .year-group:first-child .year-label { padding-top: 0; }
        .items { list-style: none; margin: 0; padding: 0; }
        .item {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 24px;
            padding: 28px 0;
            border-bottom: 1px solid var(--rule);
        }
        .year-group:first-child .item:first-child { padding-top: 4px; }
        .item:last-child { border-bottom: 0; }
        .item-month {
            font-family: var(--label);
            font-size: 13px;
            color: var(--ink-faint);
            padding-top: 6px;
        }
        .item-title {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 24px;
            line-height: 1.3;
            margin: 0;
        }
        .item-body { margin: 8px 0 0; font-size: 16px; }
        .item-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-top: 8px;
            font-family: var(--label);
            font-size: 13px;
        }
        .item-links a { color: var(--crimson); text-decoration: none; }
        .item-links a:hover { text-decoration: underline; text-underline-offset: 3px; }

        @media (max-width: 860px) {
            .year-group { grid-template-columns: 1fr; gap: 0; }
            .year-label { position: static; font-size: 28px; padding-top: 24px; }
            .item { grid-template-columns: 1fr; gap: 4px; }
            .item-month { padding-top: 0; }
        }
    </style>
</head>
<body>

<header data-site-header></header>

<main>

    <section class="page-head">
        <div class="wrap">
            <h1 class="display">News</h1>
            <p class="lede">Recent announcements and highlights from our research group.</p>
        </div>
    </section>

    <section class="section" style="padding-top: 0;">
        <div class="wrap" id="news"></div>
    </section>

</main>

<footer data-site-footer></footer>

<script src="assets/site.js"></script>
<script>
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    // An item has either a single "link" or a list of labelled "links".
    function linksHTML(n) {
        const links = n.links || (n.link ? [{ label: 'Read more', url: n.link }] : []);
        return links.length
            ? `<div class="item-links">${links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div>`
            : '';
    }

    const itemHTML = n => `
        <li class="item">
            <div class="item-month">${MONTHS[+n.date.split('-')[1] - 1]}</div>
            <div>
                <h3 class="item-title">${esc(n.title)}</h3>
                <p class="item-body">${esc(n.body)}</p>
                ${linksHTML(n)}
            </div>
        </li>`;

    fetch('news.json').then(r => r.json()).then(items => {
        items.sort((a, b) => b.date.localeCompare(a.date));
        const years = [...new Set(items.map(n => n.date.slice(0, 4)))];
        document.getElementById('news').innerHTML = years.map(y => `
            <section class="year-group">
                <h2 class="year-label">${y}</h2>
                <ul class="items">${items.filter(n => n.date.startsWith(y)).map(itemHTML).join('')}</ul>
            </section>`).join('');
    }).catch(err => console.error('Could not load news', err));
</script>

</body>
</html>
